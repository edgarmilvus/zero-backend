<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Notes, one file</title>
<style>
  :root { color-scheme: light; }
  body { font: 15px/1.6 ui-serif, Georgia, serif; margin: 0 auto; padding: 28px; max-width: 760px; background: #f7f3e8; color: #1c1a17; }
  h1 { font-size: 20px; margin: 0 0 2px; }
  #status, #count { font: 12px/1.5 ui-monospace, monospace; color: #6b6355; margin: 0 0 14px; }
  form { display: grid; gap: 6px; margin-bottom: 18px; }
  input, textarea, button { font: inherit; font-size: 14px; padding: 6px 8px; }
  textarea { min-height: 56px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { border-top: 1px solid #ddd4bf; padding: 10px 0; position: relative; }
  li strong { font-size: 15px; }
  li p { margin: 2px 0 0; white-space: pre-wrap; }
  li button { position: absolute; right: 0; top: 10px; font-size: 11px; }
  #find { width: 100%; margin-bottom: 12px; }
</style>
</head>
<body>
<h1>Notes, one file</h1>
<p id="status">loading</p>
<p id="count"></p>
<form id="add">
  <input id="title" placeholder="title" autocomplete="off" />
  <textarea id="body" placeholder="body"></textarea>
  <div class="row">
    <button type="submit">Add</button>
    <button type="button" id="share">Make a share link</button>
    <button type="button" id="export">Export one file</button>
    <label style="font-size:12px;align-self:center">Import <input type="file" id="import" accept="text/html" style="font-size:11px" /></label>
  </div>
</form>
<input id="find" placeholder="search" autocomplete="off" />
<ul id="notes"></ul>
<script>// --- model.ts
/**
 * The capstone's model: notes, a last-writer-wins merge by timestamp, and a search that is a scan.
 *
 * No imports, no types the browser cannot strip, and no collection with an index: the whole state is
 * an array of notes and the whole merge is a per-id comparison.
 */

                    
             
                
               
                    
                    
  

                   
       
                
  

function emptyDoc()      {
  return { v: 2, notes: [] };
}

const id = ()         => `n${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;

function addNote(doc     , title        , body        , now = Date.now())      {
  const trimmed = title.trim();
  if (trimmed === "") throw new Error("note: a title is required");
  const note       = { id: id(), title: trimmed, body, updatedAt: now };
  return { v: doc.v, notes: [...doc.notes, note] };
}

function editNote(doc     , noteId        , title        , body        , now = Date.now())      {
  const found = doc.notes.some((note) => note.id === noteId);
  if (!found) throw new Error(`note ${noteId}: not in this document`);
  return {
    v: doc.v,
    notes: doc.notes.map((note) =>
      note.id === noteId ? { ...note, title: title.trim() || note.title, body, updatedAt: now } : note,
    ),
  };
}

/** A tombstone, because an import from another device would resurrect a removed note otherwise. */
function deleteNote(doc     , noteId        , now = Date.now())      {
  const found = doc.notes.some((note) => note.id === noteId);
  if (!found) throw new Error(`note ${noteId}: not in this document`);
  return {
    v: doc.v,
    notes: doc.notes.map((note) => (note.id === noteId ? { ...note, deleted: true, updatedAt: now } : note)),
  };
}

function live(doc     )         {
  return doc.notes.filter((note) => !note.deleted).sort((a, b) => b.updatedAt - a.updatedAt);
}

/** Keyword search over title and body, which is the floppy-sized search. */
function search(doc     , term        )         {
  const needle = term.trim().toLowerCase();
  if (needle === "") return live(doc);
  return live(doc).filter((note) => `${note.title}\n${note.body}`.toLowerCase().includes(needle));
}

/**
 * The merge: per id, the later updatedAt wins; a tombstone is a value like any other.
 *
 * Not a CRDT with vector clocks, and the chapter says why: two devices that edit the same note while
 * apart lose one edit, and the timestamp is the only ordering there is.
 */
function mergeDocs(local     , incoming     )                                                 {
  const byId = new Map              ();
  for (const note of local.notes) byId.set(note.id, note);
  let added = 0;
  let conflicts = 0;

  for (const note of incoming.notes) {
    const mine = byId.get(note.id);
    if (!mine) {
      byId.set(note.id, note);
      added += 1;
      continue;
    }
    if (note.updatedAt > mine.updatedAt) {
      byId.set(note.id, note);
      conflicts += 1;
    } else if (note.updatedAt < mine.updatedAt) {
      conflicts += 1;
    }
  }

  return { doc: { v: 2, notes: [...byId.values()] }, added, conflicts };
}

// --- store.ts
/**
 * The store: one JSON string, a version, and a migration that refuses a future file.
 *
 * localStorage is the chapter's choice because the app is a file and the data has to survive a reload
 * without a database runtime; the interface is the same one IndexedDB would use.
 */


const KEY = "zero-backend-capstone";

function storageKey()         {
  return KEY;
}

function encodeDoc(doc     )         {
  return JSON.stringify({ v: doc.v, notes: doc.notes });
}

function decodeDoc(raw               )      {
  if (raw === null || raw === "") return { v: 2, notes: [] };
  let parsed         ;
  try {
    parsed = JSON.parse(raw);
  } catch {
    throw new Error("store: not JSON; the saved document is corrupt");
  }
  return migrate(parsed);
}

/** v1 had `text` and no `updatedAt`; v2 is what the model uses. A v3 is refused. */
function migrate(value         )      {
  if (typeof value !== "object" || value === null) throw new Error("store: expected a document");
  const root = value                                    ;

  if (root.v === 2) return { v: 2, notes: readNotes(root.notes) };
  if (root.v === 1) {
    const old = readNotes(root.notes, true);
    return { v: 2, notes: old.map((note, index) => ({ ...note, updatedAt: index + 1 })) };
  }
  throw new Error(`store: version ${String(root.v)} is newer than this build; refusing to read it`);
}

function readNotes(value         , legacy = false)               {
  if (!Array.isArray(value)) throw new Error("store.notes: expected an array");
  return value.map((entry, index) => {
    const note = entry                           ;
    if (typeof note.id !== "string") throw new Error(`store.notes[${index}]: missing id`);
    const title = typeof note.title === "string" ? note.title : typeof note.text === "string" ? note.text.slice(0, 40) : "";
    const body = typeof note.body === "string" ? note.body : typeof note.text === "string" ? note.text : "";
    const updatedAt = typeof note.updatedAt === "number" ? note.updatedAt : index + 1;
    if (legacy && title === "") throw new Error(`store.notes[${index}]: a v1 note has no text`);
    return {
      id: note.id,
      title,
      body,
      updatedAt,
      ...(note.deleted === true ? { deleted: true } : {}),
    };
  });
}

// --- app.ts
/**
 * The app: one page, four capabilities, no server.
 *
 * Notes, search, a share link and an export. Everything the page needs is in the bundle; the share
 * link mints a capability the way chapter 14 does, and the export writes chapter 15's file in its
 * smallest form.
 */



const state                             = {
  doc: decodeDoc(typeof localStorage === "undefined" ? null : localStorage.getItem(storageKey())),
  term: "",
};

const save = ()       => {
  try {
    localStorage.setItem(storageKey(), encodeDoc(state.doc));
  } catch {
    /* a full quota is a page that still works for this visit */
  }
};

const esc = (text        )         =>
  text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

const bytes = (text        )         => new TextEncoder().encode(text).byteLength;

function render()       {
  const list = document.querySelector                  ("#notes");
  const count = document.querySelector                      ("#count");
  if (!list || !count) return;

  const rows = search(state.doc, state.term);
  list.innerHTML = rows
    .map(
      (note) =>
        `<li data-id="${note.id}"><strong>${esc(note.title)}</strong><button data-del="${note.id}" title="delete this note">x</button><p>${esc(note.body)}</p></li>`,
    )
    .join("");
  count.textContent = `${rows.length} of ${live(state.doc).length} note(s), ${(bytes(encodeDoc(state.doc)) / 1024).toFixed(1)} kB stored`;
}

function canonical(value         )         {
  if (Array.isArray(value)) return `[${value.map(canonical).join(",")}]`;
  if (value !== null && typeof value === "object") {
    const entries = Object.entries(value                           )
      .filter(([, item]) => item !== undefined)
      .sort(([a], [b]) => (a < b ? -1 : a > b ? 1 : 0));
    return `{${entries.map(([key, item]) => `${JSON.stringify(key)}:${canonical(item)}`).join(",")}}`;
  }
  return JSON.stringify(value);
}

const b64 = (data            )         => {
  let binary = "";
  for (const byte of data) binary += String.fromCharCode(byte);
  return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
};

const unb64 = (text        )                          => {
  const padded = text.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((text.length + 3) % 4);
  const binary = atob(padded);
  const out = new Uint8Array(binary.length);
  for (let index = 0; index < binary.length; index += 1) out[index] = binary.charCodeAt(index);
  return out;
};

/** Chapter 14's capability, compacted: a signed claim about reading until an hour from now. */
async function share()                  {
  const pair = (await crypto.subtle.generateKey({ name: "ECDSA", namedCurve: "P-256" }, true, ["sign", "verify"]))                 ;
  const iss = b64(new Uint8Array(await crypto.subtle.exportKey("raw", pair.publicKey)));
  const payload = { v: 1, iss, scope: ["read:own"], exp: Date.now() + 60 * 60 * 1000, nonce: crypto.randomUUID() };
  const text = canonical(payload);
  const signature = b64(new Uint8Array(await crypto.subtle.sign({ name: "ECDSA", hash: "SHA-256" }, pair.privateKey, new TextEncoder().encode(text))));
  return `${b64(new TextEncoder().encode(text))}.${signature}`;
}

const EXPORT_READER = `const a=JSON.parse(document.getElementById("d").textContent);document.getElementById("c").textContent=a.notes.length+" note(s), sealed "+new Date(a.sealed).toISOString();for(const n of a.notes){const e=document.createElement("article"),h=document.createElement("h2"),p=document.createElement("p");h.textContent=n.title;p.textContent=n.body;e.append(h,p);document.body.append(e)}`;

async function exportFile()                {
  const json = JSON.stringify({ notes: live(state.doc), sealed: Date.now() });
  const safe = json.replace(/</g, "\\u003c").replace(/>/g, "\\u003e").replace(/&/g, "\\u0026");
  const html = `<!doctype html><html><head><meta charset="utf-8"><title>Exported notes</title><style>body{font:15px/1.6 ui-serif,Georgia,serif;margin:32px;background:#f7f3e8;color:#1c1a17}h2{font-size:15px;margin:18px 0 2px}p{margin:0}</style></head><body><p id="c">reading...</p><script id="d" type="application/json">${safe}<\/script><script>${EXPORT_READER}<\/script></body></html>`;
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob([html], { type: "text/html" }));
  link.download = "notes.html";
  link.click();
  URL.revokeObjectURL(link.href);
}

async function importFile(file      )                {
  const text = await file.text();
  const match = text.match(/<script id="d" type="application\/json">([\s\S]*?)<\/script>/);
  if (!match) throw new Error("import: this is not an export from this app");
  const parsed = JSON.parse(match[1]          )                            ;
  if (!Array.isArray(parsed.notes)) throw new Error("import: the file has no notes");
  const merged = mergeDocs(state.doc, { v: 2, notes: parsed.notes });
  state.doc = merged.doc;
  save();
  render();
  setStatus(`imported: ${merged.added} added, ${merged.conflicts} conflict(s)`);
}

function setStatus(text        )       {
  const status = document.querySelector                      ("#status");
  if (status) status.textContent = text;
}

function bind()       {
  const form = document.querySelector                 ("#add");
  const input = document.querySelector                  ("#title");
  const body = document.querySelector                     ("#body");
  const find = document.querySelector                  ("#find");
  const list = document.querySelector                  ("#notes");

  form?.addEventListener("submit", (event) => {
    event.preventDefault();
    if (!input || !body) return;
    try {
      state.doc = addNote(state.doc, input.value, body.value);
      input.value = "";
      body.value = "";
      save();
      render();
      setStatus("note added");
    } catch (error) {
      setStatus((error         ).message);
    }
  });

  find?.addEventListener("input", () => {
    state.term = find.value;
    render();
  });

  list?.addEventListener("click", (event) => {
    const target = event.target               ;
    const del = target.dataset.del;
    if (!del) return;
    state.doc = deleteNote(state.doc, del);
    save();
    render();
    setStatus("note deleted");
  });

  document.querySelector("#share")?.addEventListener("click", () => {
    void (async () => {
      const token = await share();
      location.hash = `cap=${token}`;
      setStatus(`share link ready in the fragment, ${token.length} characters`);
    })();
  });

  document.querySelector("#export")?.addEventListener("click", () => {
    void (async () => {
      await exportFile();
      setStatus("exported one file");
    })();
  });

  document.querySelector                  ("#import")?.addEventListener("change", (event) => {
    const file = (event.target                    ).files?.[0];
    if (!file) return;
    void importFile(file).catch((error       ) => setStatus(error.message));
  });
}

function main()       {
  bind();
  render();
  setStatus(`${live(state.doc).length} note(s) in this browser; nothing is sent anywhere`);
}

main();
</script>
</body>
</html>
